<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Popsikosland GPS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --primary: #1a73e8;
    --primary-dark: #1557b0;
    --bg: #ffffff;
    --surface: #f1f3f4;
    --text: #202124;
    --text-2: #5f6368;
    --error: #d93025;
    --ok: #188038;
    --border: #dadce0;
    --sheet-collapsed: 70px;
    --sheet-expanded: 50vh;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Roboto", "Segoe UI", system-ui, sans-serif; color: var(--text); background: #222; }

  .app { display: flex; height: 100vh; height: 100dvh; width: 100%; }

  /* ---------- Sidebar (desktop) ---------- */
  #sidebar {
    width: 360px; height: 100vh; height: 100dvh; flex: 0 0 360px;
    background: var(--bg); display: flex; flex-direction: column;
    box-shadow: 2px 0 10px rgba(0,0,0,.25); z-index: 1000;
  }
  .sheet-handle { display: none; }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  .sheet-title { margin: 0; font-size: 20px; font-weight: 500; }
  .sheet-title small { display: block; font-size: 12px; font-weight: 400; color: var(--text-2); margin-top: 2px; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-toggle {
    display: none; border: none; background: var(--surface); color: var(--text-2);
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer;
  }
  .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; letter-spacing: .3px; }
  .field select {
    width: 100%; padding: 12px; font-size: 15px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--bg); color: var(--text); appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%235f6368' stroke-width='2'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center;
  }
  .field select:focus { outline: 2px solid var(--primary); border-color: transparent; }

  #calcBtn {
    width: 100%; padding: 13px; border: none; border-radius: 24px; background: var(--primary);
    color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .2s, box-shadow .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  #calcBtn:hover { background: var(--primary-dark); }
  #calcBtn:active { box-shadow: none; }

  #info { margin-top: 18px; padding: 14px; border-radius: 8px; background: var(--surface); font-size: 14px; line-height: 1.5; display: none; }
  #info.error { background: #fce8e6; color: var(--error); display: block; }
  #info.ok { display: block; }
  #info .summary { font-weight: 500; color: var(--ok); margin-bottom: 6px; }
  #info .steps { word-break: break-word; }

  .legend { margin-top: 20px; font-size: 12px; color: var(--text-2); line-height: 1.8; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }

  /* ---------- Map ---------- */
  #map { flex: 1; height: 100%; background: #1d2a1d; }
  .leaflet-container { font-family: inherit; }
  .node-label { background: rgba(255,255,255,.92); border: none; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.4); font-weight: 500; color: var(--text); padding: 2px 6px; }
  .arrow-icon { color: #fff; font-size: 14px; text-shadow: 0 0 3px #000, 0 0 3px #000; line-height: 14px; text-align: center; }
  .popup-btns button { margin: 4px 4px 0 0; padding: 5px 10px; border: 1px solid var(--primary); background: #fff; color: var(--primary); border-radius: 12px; cursor: pointer; font-size: 12px; }

  /* ---------- Mobile: bottom sheet ---------- */
  @media (max-width: 768px) {
    .app { display: block; position: relative; }
    #map { position: absolute; inset: 0; width: 100%; height: 100vh; height: 100dvh; z-index: 1; }
    #sidebar {
      position: fixed; left: 0; right: 0; bottom: 0; width: 100%; flex: none;
      height: var(--sheet-expanded); border-radius: 18px 18px 0 0;
      box-shadow: 0 -4px 16px rgba(0,0,0,.3); transition: height .3s ease; overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }
    #sidebar.collapsed { height: var(--sheet-collapsed); }
    .sheet-handle { display: block; width: 40px; height: 4px; border-radius: 2px; background: #c4c7ca; margin: 8px auto 0; cursor: pointer; }
    .sheet-header { padding: 8px 18px 10px; border-bottom: none; cursor: pointer; }
    .sheet-toggle { display: block; }
    .sheet-body { padding: 4px 18px 20px; }
    #sidebar.collapsed .sheet-body { visibility: hidden; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="sidebar">
    <div class="sheet-handle" id="sheetHandle"></div>
    <div class="sheet-header" id="sheetHeader">
      <h1 class="sheet-title">Popsikosland GPS<small id="headerSummary"></small></h1>
      <button class="sheet-toggle" id="sheetToggle" aria-label="Згорнути/розгорнути панель">▼</button>
    </div>
    <div class="sheet-body">
      <div class="field"><label for="fromSel">ЗВІДКИ</label><select id="fromSel"></select></div>
      <div class="field"><label for="toSel">КУДИ</label><select id="toSel"></select></div>
      <div class="field"><label for="vehicleSel">ТИП ТРАНСПОРТУ</label><select id="vehicleSel"></select></div>
      <button id="calcBtn">Розрахувати маршрут</button>
      <div id="info"></div>
      <div class="legend">
        <div><i style="border-color:#9aa0a6"></i>Відкрита дорога (весь транспорт)</div>
        <div><i style="border-color:#f9ab00;border-top-style:dashed"></i>Лише легкий транспорт (вузька вулиця)</div>
        <div>➤ Односторонній рух (стрілка показує напрямок)</div>
      </div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =====================================================================
   КОНФІГУРАЦІЯ ДАНИХ  —  редагуй цей розділ для свого світу
   ===================================================================== */

// Фонове зображення + область світу Minecraft (у блоках), яку воно покриває.
// Лівий верхній кут зображення = (xMin, zMin), правий нижній = (xMax, zMax).
// Файл map.png має лежати поруч з index.html (або встав сюди повне https:// посилання).
// УВАГА: значення MAP_AREA зараз умовні (1 піксель = 1 блок, центр = 0,0).
// Постав реальні координати кутів твоєї карти, інакше координати вузлів не збігатимуться.
const MAP_IMAGE_URL = "map.png";
const MAP_AREA = { xMin: -904, xMax: 904, zMin: -800, zMax: 800 };

// Вузли / станції: id -> назва та координати X/Z у блоках Minecraft.
const NODES = {
  spawn:   { name: "Спавн",        x: 31,   z: 240  },
  cross1:  { name: "Перехрестя_1", x: 191,  z: 240  },
  city:    { name: "Місто",        x: -39,  z: -60  },
  mill:    { name: "Старий млин",  x: 191,  z: 20   },
  village: { name: "Село",         x: -304, z: 450  },
  harbor:  { name: "Порт",         x: -424, z: -470 }
};

// Типи транспорту та які типи доріг їм дозволені.
//   тип дороги "all"    -> весь транспорт
//   тип дороги "A_only" -> вузька вулиця, лише легкий транспорт
//   тип дороги "B_only" -> (приклад) лише для вантажівок
const VEHICLES = {
  A: { label: "Варіант A – Легковий транспорт", short: "легковий транспорт", allowed: ["all", "A_only", "B_only"] },
  B: { label: "Варіант B – Вантажівка",         short: "вантажівка",         allowed: ["all", "B_only"] }
};

// Дороги (ребра графа).
//   from / to : id вузлів
//   type      : тип дороги (див. VEHICLES)
//   oneWay    : true  -> рух лише від from до to
//               false -> двосторонній (за замовчуванням)
//   via       : необов'язково [[x,z], ...] точки вигину, щоб дорога не була прямою
//   weight    : необов'язково; за замовчуванням — довжина дороги в блоках
const ROADS = [
  { from: "spawn",   to: "cross1", type: "all" },
  { from: "cross1",  to: "city",   type: "A_only" },                         // короткий вузький шлях: вантажівкам заборонено
  { from: "cross1",  to: "mill",   type: "all" },                            // об'їзд для вантажівок, частина 1
  { from: "mill",    to: "city",   type: "all", via: [[191, -60]] },          // об'їзд для вантажівок, частина 2 (довший)
  { from: "city",    to: "harbor", type: "all", oneWay: true },               // односторонній: лише Місто -> Порт
  { from: "harbor",  to: "mill",   type: "all", via: [[-200, -470], [191, -470]] },
  { from: "harbor",  to: "spawn",   type: "all", oneWay: true, via: [[-200, 100]] }, // односторонній шлях назад на спавн
  { from: "spawn",   to: "village", type: "all" },
  { from: "village", to: "cross1",  type: "A_only", via: [[-100, 300]] }      // вузький провулок
];

// Відступ на мобільному, щоб маршрут не ховався за нижньою панеллю (px)
const MOBILE_ROUTE_PADDING = { top: 60, left: 30, right: 30, bottom: 70 + 40 };

/* =====================================================================
   COORDINATE HELPERS
   Leaflet CRS.Simple: lat = vertical, lng = horizontal.
   lng = X.  lat = -Z, so that North (-Z) is up like on an in-game map
   (Z still acts as the latitude axis, just sign-flipped for screen up).
   ===================================================================== */
const toLatLng = (x, z) => L.latLng(-z, x);
const nodeLL = id => toLatLng(NODES[id].x, NODES[id].z);

/* =====================================================================
   GRAPH + PATHFINDING (Dijkstra, directed edges, per-vehicle filtering)
   ===================================================================== */
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

function buildGraph() {
  const adj = {};
  Object.keys(NODES).forEach(id => adj[id] = []);
  ROADS.forEach(r => {
    if (!NODES[r.from] || !NODES[r.to]) { console.warn("Unknown node in road", r); return; }
    const pts = [[NODES[r.from].x, NODES[r.from].z], ...(r.via || []), [NODES[r.to].x, NODES[r.to].z]];
    let len = 0;
    for (let i = 1; i < pts.length; i++) len += dist(pts[i - 1], pts[i]);
    const w = r.weight ?? len;
    adj[r.from].push({ to: r.to, weight: w, type: r.type, points: pts, road: r });
    if (!r.oneWay) adj[r.to].push({ to: r.from, weight: w, type: r.type, points: [...pts].reverse(), road: r });
  });
  return adj;
}
const GRAPH = buildGraph();

function dijkstra(start, end, vehicleKey) {
  const allowed = new Set(vehicleKey ? VEHICLES[vehicleKey].allowed : null);
  const useAll = !vehicleKey;
  const d = {}, prev = {}, done = new Set();
  Object.keys(NODES).forEach(id => d[id] = Infinity);
  d[start] = 0;
  while (true) {
    let u = null, best = Infinity;
    for (const id in d) if (!done.has(id) && d[id] < best) { best = d[id]; u = id; }
    if (u === null || u === end) break;
    done.add(u);
    for (const e of GRAPH[u]) {
      if (!useAll && !allowed.has(e.type)) continue;   // vehicle restriction
      const nd = d[u] + e.weight;
      if (nd < d[e.to]) { d[e.to] = nd; prev[e.to] = { node: u, edge: e }; }
    }
  }
  if (d[end] === Infinity) return null;
  const nodes = [end], edges = [];
  for (let c = end; c !== start; c = prev[c].node) { edges.unshift(prev[c].edge); nodes.unshift(prev[c].node); }
  return { nodes, edges, distance: d[end] };
}

/* =====================================================================
   MAP SETUP
   ===================================================================== */
const mobileQuery = window.matchMedia("(max-width: 768px)");
const isMobile = () => mobileQuery.matches;

const map = L.map("map", {
  crs: L.CRS.Simple, minZoom: -3, maxZoom: 3, zoomControl: false,
  zoomSnap: 0.25, attributionControl: false
});

const mapBounds = L.latLngBounds(
  toLatLng(MAP_AREA.xMin, MAP_AREA.zMax),
  toLatLng(MAP_AREA.xMax, MAP_AREA.zMin)
);
L.imageOverlay(MAP_IMAGE_URL, mapBounds).addTo(map);
map.fitBounds(mapBounds);

// Zoom control: bottom-right on desktop, top-right on mobile (clear of the bottom sheet)
let zoomCtl = null;
function placeZoomControl() {
  if (zoomCtl) map.removeControl(zoomCtl);
  zoomCtl = L.control.zoom({ position: isMobile() ? "topright" : "bottomright" }).addTo(map);
}
placeZoomControl();

// Draw road network (faint) + node markers
const ROAD_STYLE = { all: "#9aa0a6", A_only: "#f9ab00", B_only: "#34a853" };
const roadLayer = L.layerGroup().addTo(map);
ROADS.forEach(r => {
  const e = GRAPH[r.from].find(x => x.road === r);
  const latlngs = e.points.map(p => toLatLng(p[0], p[1]));
  L.polyline(latlngs, {
    color: ROAD_STYLE[r.type] || "#9aa0a6", weight: 3, opacity: .75,
    dashArray: r.type === "all" ? null : "8 6"
  }).addTo(roadLayer);
  if (r.oneWay) {
    const a = e.points[0], b = e.points[1];
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    const angle = Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
    L.marker(toLatLng(mid[0], mid[1]), {
      interactive: false,
      icon: L.divIcon({ className: "", iconSize: [14, 14], iconAnchor: [7, 7],
        html: `<div class="arrow-icon" style="transform:rotate(${angle}deg)">➤</div>` })
    }).addTo(roadLayer);
  }
});

const fromSel = document.getElementById("fromSel");
const toSel = document.getElementById("toSel");
const vehicleSel = document.getElementById("vehicleSel");

Object.entries(NODES).forEach(([id, n]) => {
  const m = L.circleMarker(nodeLL(id), { radius: 7, color: "#fff", weight: 2, fillColor: "#1a73e8", fillOpacity: 1 }).addTo(map);
  m.bindTooltip(n.name, { permanent: true, direction: "top", offset: [0, -8], className: "node-label" });
  const pop = document.createElement("div");
  pop.innerHTML = `<b>${n.name}</b><br>X: ${n.x}, Z: ${n.z}<div class="popup-btns"><button data-a="from">Звідси</button><button data-a="to">Сюди</button></div>`;
  pop.querySelector('[data-a="from"]').onclick = () => { fromSel.value = id; m.closePopup(); };
  pop.querySelector('[data-a="to"]').onclick = () => { toSel.value = id; m.closePopup(); };
  m.bindPopup(pop);
  [fromSel, toSel].forEach(sel => sel.add(new Option(n.name, id)));
});
Object.entries(VEHICLES).forEach(([k, v]) => vehicleSel.add(new Option(v.label, k)));
const ids = Object.keys(NODES);
fromSel.value = ids[0];
toSel.value = ids[2] ?? ids[ids.length - 1];

/* =====================================================================
   ROUTE CALCULATION + DISPLAY
   ===================================================================== */
const infoBox = document.getElementById("info");
const headerSummary = document.getElementById("headerSummary");
let routeLine = null;

function showError(msg) {
  infoBox.className = "error";
  infoBox.textContent = msg;
  headerSummary.textContent = "";
}

function calculateRoute() {
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
  const from = fromSel.value, to = toSel.value, veh = vehicleSel.value;
  const vName = VEHICLES[veh].short;

  if (from === to) { showError("Початок і кінець маршруту збігаються."); return; }

  const route = dijkstra(from, to, veh);
  if (!route) {
    const anyRoute = dijkstra(from, to, null);
    showError(anyRoute
      ? `Маршрут заблоковано для варіанта ${veh} (${vName}). Шлях існує, але лише через заборонені або односторонні дороги.`
      : "Маршруту між цими точками не існує (перевір односторонні дороги).");
    if (isMobile()) setSheet(false);
    return;
  }

  // Build geometry from the edges' bend points
  const latlngs = [];
  route.edges.forEach((e, i) => {
    e.points.forEach((p, j) => { if (i === 0 || j > 0) latlngs.push(toLatLng(p[0], p[1])); });
  });
  routeLine = L.polyline(latlngs, { color: "#1a73e8", weight: 7, opacity: .85, lineJoin: "round", lineCap: "round" }).addTo(map);

  const names = route.nodes.map(id => NODES[id].name).join(" ➔ ");
  const km = (route.distance / 1000).toFixed(2);
  infoBox.className = "ok";
  infoBox.innerHTML = `<div class="summary">Маршрут знайдено · ${Math.round(route.distance)} блоків (${km} км)</div><div class="steps">${names}</div>`;
  headerSummary.textContent = `${NODES[from].name} ➔ ${NODES[to].name} · ${Math.round(route.distance)} блоків`;

  // On mobile: collapse the sheet first, then fit with padding so the route clears it
  if (isMobile()) setSheet(false);
  fitRoute();
}

function fitRoute() {
  if (!routeLine) return;
  const opts = isMobile()
    ? { paddingTopLeft: [MOBILE_ROUTE_PADDING.left, MOBILE_ROUTE_PADDING.top],
        paddingBottomRight: [MOBILE_ROUTE_PADDING.right, MOBILE_ROUTE_PADDING.bottom] }
    : { padding: [60, 60] };
  map.fitBounds(routeLine.getBounds(), { ...opts, maxZoom: 2 });
}
document.getElementById("calcBtn").addEventListener("click", calculateRoute);

/* =====================================================================
   MOBILE BOTTOM SHEET
   ===================================================================== */
const sidebar = document.getElementById("sidebar");
const sheetToggle = document.getElementById("sheetToggle");

function setSheet(expanded) {
  sidebar.classList.toggle("collapsed", !expanded);
  sheetToggle.textContent = expanded ? "▼" : "▲";
}
const toggleSheet = () => setSheet(sidebar.classList.contains("collapsed"));

sheetToggle.addEventListener("click", e => { e.stopPropagation(); toggleSheet(); });
document.getElementById("sheetHandle").addEventListener("click", toggleSheet);
document.getElementById("sheetHeader").addEventListener("click", () => { if (isMobile()) toggleSheet(); });

// Swipe up / down on the handle + header
let touchY = null;
["sheetHandle", "sheetHeader"].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => {
    if (touchY === null) return;
    const dy = e.changedTouches[0].clientY - touchY;
    touchY = null;
    if (dy < -30) setSheet(true);
    else if (dy > 30) setSheet(false);
  }, { passive: true });
});

// Respond to viewport changes (rotation, desktop <-> mobile)
function onLayoutChange() {
  placeZoomControl();
  if (!isMobile()) sidebar.classList.remove("collapsed");
  setTimeout(() => { map.invalidateSize(); fitRoute(); }, 320);
}
mobileQuery.addEventListener("change", onLayoutChange);
window.addEventListener("resize", () => map.invalidateSize());

// Start: expanded on both layouts
setSheet(true);
</script>
</body>
</html>
